<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1656">
    <title>Opus 5.5 Recreation vs Original Seedance</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-Var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; }

      /* Two stacked panels, each the film scaled to 1920 wide, with a thin black gap between them. */
      .panel { position: absolute; left: 0; width: 1920px; height: 824px; overflow: hidden; background: #000; }
      #panel-top { top: 0; }
      #panel-bottom { top: 832px; }
      .panel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* Label chip. Its resting place is the panel's top-right corner at the small size; the timeline starts it
         large and centred at the top, then glides it into the corner. */
      .chip { position: absolute; top: 24px; right: 28px; transform-origin: 100% 0; }
      .chip-in { display: block; padding: 7px 16px 6px; border: 2px solid transparent; }
      .chip-text { display: inline-block; font-family: "Archivo", sans-serif; font-weight: 850; font-stretch: 88%;
        font-size: 30px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; white-space: nowrap;
        transform: skewX(-9deg); }
      .chip-lime .chip-in { background: #d9f41c; color: #000; }
      .chip-dark .chip-in { background: #000; color: #fff; border-color: #fff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="140.8" data-fps="25" data-width="1920" data-height="1656">
      <div class="panel" id="panel-top">
        <video id="v-recreation" class="clip" src="media/recreation.mp4" data-start="0" data-duration="140.8" data-track-index="0" muted playsinline></video>
        <div class="chip chip-lime" id="chip-top"><span class="chip-in" id="chip-top-in"><span class="chip-text">Opus 5.5 Recreation</span></span></div>
      </div>
      <div class="panel" id="panel-bottom">
        <video id="v-original" class="clip" src="media/original.mp4" data-start="0" data-duration="140.8" data-track-index="1" muted playsinline></video>
        <div class="chip chip-dark" id="chip-bottom"><span class="chip-in" id="chip-bottom-in"><span class="chip-text">Original Seedance</span></span></div>
      </div>
      <!-- Sound: the recreation's own soundtrack (synthesized in code). -->
      <audio id="a-score" src="media/recreation.mp4" data-start="0" data-duration="140.8" data-track-index="2"></audio>
    </div>
    <script>
      (async () => {
        await document.fonts.load("850 30px Archivo");
        await document.fonts.ready;
        const tl = gsap.timeline({ paused: true });
        const PANEL_W = 1920, RIGHT = 28, TOP = 24, BIG = 2.6, BIG_TOP = 44;
        for (const id of ["chip-top", "chip-bottom"]) {
          const chip = document.getElementById(id), inner = document.getElementById(id + "-in");
          const w = chip.offsetWidth;
          // with the transform origin at the chip's top-right, x moves that corner: centre the enlarged chip
          const x0 = (PANEL_W + w * BIG) / 2 - (PANEL_W - RIGHT);
          tl.fromTo(chip, { x: x0, y: BIG_TOP - TOP, scale: BIG }, { x: 0, y: 0, scale: 1, duration: 0.8, ease: "power3.inOut" }, 2.0);
          tl.fromTo(inner, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.15);
          tl.to(inner, { opacity: 0, duration: 0.45, ease: "power1.in" }, 140.2);
        }
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
