<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Owl kit gallery</title>
<!-- Scratch page for src/lib/owlInk.js. Serve the project root with any static server (ES modules do not load from
     file://), open /tools/owl-gallery.html. Pages: 0 presets, 1 parts, 2 live pose playground (this page only),
     3 the kit's sit3q at the s12 placement (compare with the source at 34.0 s), 4 parts at close-up scale (folded wing,
     tail, talons, headphone views, eye states), 5 more presets and variations (wingUp, tumble, hold, props via extra,
     look/lookGain, flips, banking, small sizes), 6 the F4c eye states (glossy / tired / sly / scowl / pin / shut, looks),
     7 the F4c presets fitted to the source (perch, perchTired, flyFront, flyToward, startle3q, hipsSmug) and variations,
     8 the F4c parts (layered / raised / scallop / feathered-arm wings, grip feet, edge-on cups, slim band, shield / grin
     beaks, sweat, featherEdge, spiky tuft, discLine), 10+ each fitted preset alone at its measured source placement
     (FIT_PLACE: compare with the source frame at FIT_PLACE[name].t).
     Without a server: the same painter (paintGallery) is rendered headlessly by a scratch HyperFrames project whose
     timeline shows page floor(t) — see docs/owl.md, "Gallery". -->
<style>
  html, body { margin: 0; background: #111; color: #bbb; font: 13px/1.4 ui-monospace, Menlo, monospace; }
  #bar { padding: 8px 12px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  #bar label { display: flex; gap: 6px; align-items: center; }
  canvas { display: block; width: 100%; height: auto; background: #000; }
  button { background: #222; color: #ddd; border: 1px solid #444; padding: 4px 10px; cursor: pointer; }
  #play { display: none; }
</style>
</head>
<body>
<div id="bar">
  <button data-page="0">poses</button><button data-page="1">parts</button><button data-page="2">playground</button><button data-page="3">kit hero</button><button data-page="4">parts close-up</button><button data-page="5">more poses</button>
  <button data-page="6">F4c eyes</button><button data-page="7">F4c presets</button><button data-page="8">F4c parts</button>
  <label>fit <select id="fit"><option value="">(fitted preset at its source placement)</option></select></label>
  <span id="play">
    <label>pose <select id="pose"></select></label>
    <label>eyes <select id="eye"></select></label>
    <label>yaw <input id="yaw" type="range" min="-0.9" max="0.9" step="0.05" value="0" /></label>
    <label>pitch <input id="pitch" type="range" min="-0.4" max="0.4" step="0.02" value="0" /></label>
    <label>roll <input id="roll" type="range" min="-0.6" max="0.6" step="0.02" value="0" /></label>
    <label>lookX <input id="lx" type="range" min="-1" max="1" step="0.05" value="0" /></label>
    <label>lookY <input id="ly" type="range" min="-1" max="1" step="0.05" value="0" /></label>
    <label>beak <input id="open" type="range" min="0" max="1" step="0.05" value="0" /></label>
    <label>scale <input id="s" type="range" min="0.2" max="2.6" step="0.05" value="1.2" /></label>
    <label>rot <input id="rot" type="range" min="-3.14" max="3.14" step="0.05" value="0" /></label>
    <label><input id="flip" type="checkbox" /> flip</label>
  </span>
</div>
<canvas id="c" width="2206" height="946"></canvas>
<script type="module">
  import { paintGallery, drawOwl, owlPose, POSES, EYE_STATES, FIT_PLACE } from "../src/lib/owlInk.js";
  const c = document.getElementById("c"), g = c.getContext("2d");
  const $ = (id) => document.getElementById(id);
  for (const k of Object.keys(POSES)) $("pose").add(new Option(k, k));
  $("eye").add(new Option("(preset)", ""));
  for (const k of Object.keys(EYE_STATES)) $("eye").add(new Option(k, k));
  Object.keys(FIT_PLACE).forEach((k, i) => $("fit").add(new Option(`${k} (source ${FIT_PLACE[k].t} s)`, String(10 + i))));
  $("fit").oninput = () => { if ($("fit").value) { page = +$("fit").value; render(); } };
  $("pose").value = "perch";
  let page = 7;   // open on the F4c presets
  function playground() {
    g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
    const base = POSES[$("pose").value];
    const yaw = +$("yaw").value, pitch = +$("pitch").value, roll = +$("roll").value;
    const over = {
      head: { yaw: (base.head.yaw || 0) + yaw, pitch: (base.head.pitch || 0) + pitch, roll: (base.head.roll || 0) + roll },
      headphones: base.headphones && base.headphones.yaw !== undefined ? { yaw: base.headphones.yaw + yaw } : {},
      eyes: { look: [+$("lx").value, +$("ly").value], ...($("eye").value ? { state: $("eye").value } : {}) },
      beak: { open: +$("open").value },
    };
    const a = drawOwl(g, { ...owlPose($("pose").value, over), x: 1103, y: 520, s: +$("s").value, rot: +$("rot").value, flip: $("flip").checked });
    // anchors
    g.fillStyle = "#e33";
    for (const p of [a.head, a.beak, ...a.eyes, ...a.wingTips, ...a.feet]) { g.beginPath(); g.arc(p[0], p[1], 4, 0, 7); g.fill(); }
    g.strokeStyle = "#444"; g.strokeRect(a.bbox[0], a.bbox[1], a.bbox[2] - a.bbox[0], a.bbox[3] - a.bbox[1]);
  }
  function render() {
    $("play").style.display = page === 2 ? "inline-flex" : "none";
    if (page === 2) playground(); else paintGallery(g, page, c.width, c.height);
  }
  for (const b of document.querySelectorAll("button[data-page]")) b.onclick = () => { page = +b.dataset.page; render(); };
  for (const el of document.querySelectorAll("#play input, #play select")) el.oninput = render;
  await document.fonts.ready;
  render();
</script>
</body>
</html>
