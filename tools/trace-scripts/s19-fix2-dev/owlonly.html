<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:transparent}</style></head><body><canvas id="c" width="2206" height="946"></canvas>
<script type="module">
const { drawOwlAt } = await import('/src/shots/s19/anim.js' + location.search.replace('?','?v='));
