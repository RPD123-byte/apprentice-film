<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Satoshi"; src: url("../../assets/fonts/Satoshi-Variable.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Geist Mono"; src: url("../../assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
html,body{margin:0;background:#000}
</style></head><body>
<canvas id="film" width="2206" height="946"></canvas>
<script type="module">
import { createPost } from "../../src/lib/post.js";
import { W, H } from "../../src/config.js";
const mod = await import("../../src/shots/s40_endcard.js");
const card = await import("../../src/shots/s40/card.js");
const s = mod.s40; s.start = 136.0; s.end = 140.8;
const out = document.getElementById("film");
const paint = document.createElement("canvas"); paint.width = W; paint.height = H;
const ctx = paint.getContext("2d");
const grade = createPost(out);
await document.fonts.load("900 100px Satoshi"); await document.fonts.load("500 20px 'Geist Mono'");
await document.fonts.ready;
window.render = (t, raw) => {
  const t0 = performance.now();
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.fillStyle = "#000"; ctx.fillRect(0,0,W,H);
  if (window.cardOnly) card.paintCard(ctx, t); else s.draw(ctx, t - s.start, t, s); ctx.restore();
  const fade = Math.min(1, Math.max(0, (140.77 - t) / 0.57));
  grade(paint, t, { fade, ...(s.grade ? s.grade(t - s.start, t) : {}) });
  const ms = performance.now() - t0;
  return window.noenc ? { ms } : { url: (raw ? paint : out).toDataURL("image/png"), ms };
};
window.ready = true;
</script></body></html>
