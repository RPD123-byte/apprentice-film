<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2206, height=946">
    <title>F2 harness</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-Var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Shrikhand"; src: url("assets/fonts/Shrikhand.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Fraunces Soft"; src: url("assets/fonts/FrauncesSoft-Black.ttf") format("truetype"); font-weight: 900; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-500.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 2206px; height: 946px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; }
      #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-f2r1" id="root" data-composition-id="main" data-start="0" data-duration="140.8" data-fps="25" data-width="2206" data-height="946">
      <canvas data-hf-id="hf-f2r2" id="film" width="2206" height="946"></canvas>
    </div>
    <script type="module">
      // F2 scratch harness (not part of the film): the colour page alone, through the film's grade.
      //   112.7 <= t < 117.52 : hippiePageCanvas() under pageArrival(t)
      //   84 <= t < 112.7     : the banner strip alone in the framed header slot (on black)
      //   117.52 <= t         : hippiePageSmall(755) in the middle (laptop-size check)
      //   t < 10              : layer contact sheet (t < 1: raw, ungraded)
      import { createPost } from "./src/lib/post.js";
      import { FRAMED, HEADER } from "./src/lib/sites.js";
      import * as H from "./src/lib/hippie.js";
      await Promise.all(["400 100px Shrikhand", "900 100px \"Fraunces Soft\"", "600 20px Poppins", "500 20px Poppins", "700 20px Poppins", "600 27px Archivo"].map((f) => document.fonts.load(f)));
      const out = document.getElementById("film");
      const paint = document.createElement("canvas"); paint.width = 2206; paint.height = 946;
      const ctx = paint.getContext("2d");
      const grade = createPost(out);
      function renderAt(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 2206, 946);
        if (t >= 6 && t < 10) {
          ctx.fillStyle = "#777"; ctx.fillRect(0, 0, 2206, 946);
          const name = ["backdrop", "scene", "illustration", "designer"][Math.floor(t) - 6];
          ctx.drawImage(H.hippieLayer(name), 0, 0);
          grade(paint, 117.4, {}); return;
        }
        if (t < 10) {
          ctx.fillStyle = "#777"; ctx.fillRect(0, 0, 2206, 946);
          const names = ["illustration", "backdrop", "scene", "designer", "headline", "nav"];
          names.forEach((n, i) => ctx.drawImage(H.hippieLayer(n), (i % 3) * 735, Math.floor(i / 3) * 316, 735, 315));
          ctx.drawImage(H.hippiePageCanvas({ headline: false, nav: false }), 0, 632, 735, 315);
          ctx.drawImage(H.hippiePageSmall(735), 735, 632);
          ctx.drawImage(H.hippieBannerCanvas(), 1470, 632, 735, 72);
          if (t < 1) { out.getContext; }
          grade(paint, 117.4, {}); return;
        }
        if (t >= 112.7 && t < 117.52) {
          const { s, tx, ty } = H.pageArrival(t); ctx.setTransform(s, 0, 0, s, tx, ty); ctx.drawImage(H.hippiePageCanvas(), 0, 0);
        } else if (t >= 84 && t < 112.7) {
          ctx.setTransform(FRAMED.sx, 0, 0, FRAMED.sy, FRAMED.x, FRAMED.y);
          ctx.drawImage(H.hippieBannerCanvas(), HEADER.x, HEADER.y, HEADER.w, HEADER.h);
        } else if (t >= 117.52) {
          ctx.drawImage(H.hippiePageSmall(755), 725, 311);
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        grade(paint, t, {});
      }
      const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; renderAt(v); } };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: 140.8, duration: 140.8, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
