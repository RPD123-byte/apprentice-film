<!doctype html>
<html><head><meta charset="utf-8"><title>soko test</title>
<style>
@font-face { font-family: "Archivo"; src: url("../assets/fonts/Archivo-Var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("../assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="out" width="2206" height="946"></canvas>
<script type="module">
// Scratch harness for the sōko page (F1). Not part of the film.
//   ?mode=ill            engraved illustration only (page coords, no UI, no grade)
//   ?mode=page&t=50      the provisional s17 shot at film time t, through the film's grade
//   ?mode=framed&t=72    drawFramedPage (header on/off via &header=0) at film time t, through the grade
//   ?mode=small          sokoIllSmall on a 1600x904 laptop page (drawSoko)
//   &raw=1               skip the grade
import { createPost } from "../src/lib/post.js";
const q = new URLSearchParams(location.search);
const mode = q.get("mode") || "blank", t = parseFloat(q.get("t") || "50"), raw = q.get("raw") === "1";
await Promise.all(["900 100px Archivo", "400 20px Geist", "300 20px Geist", "500 20px 'Geist Mono'"].map((f) => document.fonts.load(f)));
await document.fonts.ready;
const out = document.getElementById("out");
const paint = document.createElement("canvas"); paint.width = 2206; paint.height = 946;
const ctx = paint.getContext("2d");
ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 2206, 946);
const T0 = performance.now();
if (mode === "ill") {
  const { sokoIllCanvas } = await import("../src/lib/sokoIll.js");
  ctx.drawImage(sokoIllCanvas({ gaze: q.get("gaze") || "owl" }), 0, 0, 2206, 946);
} else if (mode === "page") {
  const { shot } = await import("../src/shots/s17.js");
  shot.draw(ctx, t - 47.84, t);
} else if (mode === "framed") {
  const S = await import("../src/lib/sites.js");
  const pc = S.sokoPageCanvas({ header: q.get("header") !== "0", gaze: "down" });
  const strip = q.get("strip");   // strip=dx,dy,rot: draw the header strip displaced (as if lifted)
  S.drawFramedPage(ctx, pc, { over: strip ? (g) => { const [dx, dy, r] = strip.split(",").map(Number); g.save(); S.framedTransform(g); g.translate(S.HEADER.x + S.HEADER.w / 2 + dx, S.HEADER.y + S.HEADER.h / 2 + dy); g.rotate(r); const c = S.sokoHeaderCanvas({ gaze: "down" }); g.drawImage(c, -S.HEADER.w / 2, -S.HEADER.h / 2, S.HEADER.w, S.HEADER.h); g.restore(); } : null });
} else if (mode === "small") {
  const S = await import("../src/lib/sites.js");
  const { sokoIllSmall } = await import("../src/lib/sokoIll.js");
  const c = S.pageCanvas("soko-laptop-test", 1600, 904, (g, w, h) => S.drawSoko(g, w, h, { ill: sokoIllSmall }));
  ctx.drawImage(c, 0, 0);
}
window.__timing = (performance.now() - T0).toFixed(0) + "ms";
if (raw || mode === "blank" || mode === "ill" || mode === "small") {
  out.getContext("2d").drawImage(paint, 0, 0);
} else {
  const grade = createPost(out);
  grade(paint, t, { fade: 1 });
}
window.__done = true;
</script></body></html>
