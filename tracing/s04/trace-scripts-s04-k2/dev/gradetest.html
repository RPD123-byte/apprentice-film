<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body><canvas id="c" width="2206" height="946"></canvas>
<script type="module">
const { createPost } = await import('/src/lib/post.js');
const out = document.getElementById('c');
const paint = document.createElement('canvas'); paint.width = 2206; paint.height = 946;
const g = paint.getContext('2d');
g.fillStyle = '#000'; g.fillRect(0, 0, 2206, 946);
for (let i = 0; i < 16; i++) { const v = i * 17; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(40 + i * 132, 100, 120, 300); }
for (let i = 0; i < 16; i++) { const v = 255 - i * 17; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(40 + i * 132, 500, 120, 300); }
const grade = createPost(out);
window.renderAt = (t) => { grade(paint, t, { fade: 1 }); return 0; };
window.__ready = true;
</script></body></html>
