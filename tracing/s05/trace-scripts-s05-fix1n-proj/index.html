<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2206, height=946">
<title>s05 scratch</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-Var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Variable.ttf") format("truetype"); font-weight: 100 900; }
@font-face { font-family: "Shrikhand"; src: url("assets/fonts/Shrikhand.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Fraunces Soft"; src: url("assets/fonts/FrauncesSoft-Black.ttf") format("truetype"); font-weight: 900; }
@font-face { font-family: "Satoshi"; src: url("assets/fonts/Satoshi-Variable.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-500.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
* { margin: 0; padding: 0; } html, body { width: 2206px; height: 946px; overflow: hidden; background: #000; }
#root { position: relative; width: 100%; height: 100%; } canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<div data-hf-id="hf-f506" id="root" data-composition-id="main" data-start="0" data-duration="40" data-fps="25" data-width="2206" data-height="946">
<canvas data-hf-id="hf-mule" id="film" width="2206" height="946"></canvas>
<canvas data-hf-id="hf-uw2c" id="raw" width="2206" height="946" style="display:none"></canvas>
</div>


<script type="module">
// scratch: proj time P = n/30 -> exact source frame k = 578 + n (graded, P < 10) or ungraded pre-grade paint (P >= 10: k = 578 + (P-10)*30)
// P >= 20: film render via main.js (s04 tail / s06 head): k = 570 + (P-20)*30
import { createPost } from "./src/lib/post.js";
import { shot } from "./src/shots/s05.js";
import { inkLayer } from "./src/shots/s05/layers.js";
const NAMES = ["room", "desk", "lh", "rh", "rhB", "arm", "armB", "fig", "owl", "owlD"];
const W = 2206, H = 946;
const film = document.getElementById("film"), raw = document.getElementById("raw");
const paint = document.createElement("canvas"); paint.width = W; paint.height = H;
const ctx = paint.getContext("2d");
const grade = createPost(film);
await Promise.all(["900 100px Archivo", "400 20px Geist", "600 20px Geist", "500 20px 'Geist Mono'", "400 20px Fraunces", "700 20px Fraunces", "900 100px 'Fraunces Soft'", "800 40px Satoshi", "400 40px Shrikhand", "500 20px Poppins", "600 20px Poppins", "700 20px Poppins"].map((f) => document.fonts.load(f)));
function renderAt(pt) {
  window.__SHX = pt >= 35 ? 200 : 0; if (pt >= 35) pt -= 5;
  if (pt >= 30) {   // debug: layer NAMES[n] alone on magenta, ungraded
    const n = Math.round((pt - 30) * 30); raw.style.display = "block"; film.style.display = "none";
    const r = raw.getContext("2d"); r.setTransform(1,0,0,1,0,0); r.fillStyle = "#ff00ff"; r.fillRect(0, 0, W, H);
    const l = inkLayer(NAMES[n]); r.drawImage(l.c, l.x - (window.__SHX || 0), l.y); r.strokeStyle = "#0f0"; r.strokeRect(l.x, l.y, l.w, l.h); return;
  }
  const ungraded = pt >= 10;
  const n = Math.round((ungraded ? pt - 10 : pt) * 30);
  const t = (578 + n) / 25;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const t0 = performance.now();
  try { shot.draw(ctx, t - 23.12, t); } catch (e) { console.error(e); }
  ctx.restore();
  const drawms = performance.now() - t0; console.log("s05 draw", t.toFixed(3), drawms.toFixed(1), "ms");
  if (ungraded) { raw.style.display = "block"; film.style.display = "none"; raw.getContext("2d").drawImage(paint, 0, 0); }
  else { raw.style.display = "none"; film.style.display = "block"; grade(paint, t, { fade: 1 }); }
}
const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; renderAt(v); } };
const tl = gsap.timeline({ paused: true });
tl.fromTo(clock, { t: 0 }, { t: 40, duration: 40, ease: "none" }, 0);
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
renderAt(0);
</script>
</body>
</html>
