<!--#include head-->
<script type="module">
while(!window.__fontsReady) await new Promise(r=>setTimeout(r,20));
const q=new URLSearchParams(location.search); const mode=q.get('mode')||'page';
const { drawPurePage, drawPureOverlay, PURE_CARD } = await import('/src/lib/pureimg.js');
const c=document.getElementById('c'),ctx=c.getContext('2d');
const t0=performance.now();
if(mode==='page'){ c.width=1600;c.height=1000; drawPurePage(ctx,{}); if(q.get('ov')) drawPureOverlay(ctx,{sel:1,card:{text:q.get('text')||'',caret:true,smiley:1}}); }
else if(mode==='region'){ const K=+(q.get('k')||2), x0=+(q.get('x0')||660), y0=+(q.get('y0')||100), x1=+(q.get('x1')||1600), y1=+(q.get('y1')||510);
  c.width=(x1-x0)*K; c.height=(y1-y0)*K; ctx.setTransform(K,0,0,K,-x0*K,-y0*K); drawPurePage(ctx,{}); drawPureOverlay(ctx,{sel:1,card:{text:q.get('text')||'This is r',caret:true,smiley:1}}); }
window.__info=(performance.now()-t0).toFixed(0)+'ms draw';
window.__done=true;
</script>
