<!--#include head-->
<script type="module">
while(!window.__fontsReady) await new Promise(r=>setTimeout(r,20));
const { shot } = await import('/src/shots/s08.js');
const { createPost } = await import('/src/lib/post.js');
const c=document.getElementById('c');
const paint=document.createElement('canvas'); paint.width=2206; paint.height=946;
const ctx=paint.getContext('2d');
const grade=createPost(c);
window.renderT=(t, raw)=>{
  const t0=performance.now();
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#000'; ctx.fillRect(0,0,2206,946);
  shot.draw(ctx, t-30.56, t); ctx.restore(); ctx.getImageData(0,0,1,1); window.__drawms=performance.now()-t0;
  if (raw) { const d=paint.toDataURL('image/png'); return [d, performance.now()-t0]; }
  grade(paint, t, { fade: 1, ...(shot.grade ? shot.grade(t-30.56, t) : {}) });
  gl_sync(); return [c.toDataURL('image/png'), window.__drawms];
};
function gl_sync(){ const g=c.getContext('webgl'); if(g){ const px=new Uint8Array(4); g.readPixels(0,0,1,1,g.RGBA,g.UNSIGNED_BYTE,px);} }
window.__done=true;
</script>
