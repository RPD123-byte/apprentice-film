<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2206, height=946">
<title>owl gallery scratch</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
* { margin: 0; padding: 0; } html, body { width: 2206px; height: 946px; overflow: hidden; background: #000; }
#root { position: relative; width: 100%; height: 100%; } canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<div data-hf-id="hf-l8zd" id="root" data-composition-id="main" data-start="0" data-duration="10" data-fps="25" data-width="2206" data-height="946">
<canvas data-hf-id="hf-jv0z" id="c" width="2206" height="946"></canvas>
</div>
<script type="module">
import { paintGallery, owlLayer, owlPose, HERO_PLACE } from "./src/lib/owlInk.js";
function bench() {
  const out = [];
  const cases = [["sit3q hero s2.6", { ...owlPose("sit3q"), ...HERO_PLACE }], ["fly s0.8", { ...owlPose("fly"), x: 900, y: 400, s: 0.8 }], ["front s0.4", { ...owlPose("front"), x: 300, y: 300, s: 0.4 }], ["front s0.4 tone:false", { ...owlPose("front"), x: 300, y: 300, s: 0.4, tone: false }], ["walk s1 res2 tone:false", { ...owlPose("walk"), x: 600, y: 500, s: 1, res: 2, tone: false }], ["angry s0.9", { ...owlPose("angry"), x: 900, y: 500, s: 0.9 }]];
  const cv = document.createElement("canvas");
  for (const [name, pose] of cases) { owlLayer({ ...pose, canvas: cv }); const t0 = performance.now(); for (let i = 0; i < 5; i++) owlLayer({ ...pose, canvas: cv }); out.push([name, (performance.now() - t0) / 5]); }
  return out;
}
const c = document.getElementById("c"), g = c.getContext("2d");
await document.fonts.load("500 18px 'Geist Mono'").catch(() => {});
let last = -1;
const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; const p = Math.floor(v + 1e-6); if (p !== last) { last = p; const t0 = performance.now(); if (p === 9) { g.fillStyle = "#000"; g.fillRect(0, 0, 2206, 946); g.fillStyle = "#ddd"; g.font = "28px monospace"; bench().forEach(([n, ms], i) => g.fillText(n + ": " + ms.toFixed(1) + " ms", 60, 80 + i * 44)); } else paintGallery(g, p, 2206, 946); console.log("page", p, (performance.now() - t0).toFixed(0), "ms"); } } };
const tl = gsap.timeline({ paused: true });
tl.fromTo(clock, { t: 0 }, { t: 10, duration: 10, ease: "none" }, 0);
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
</script>
</body>
</html>
