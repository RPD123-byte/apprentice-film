<!DOCTYPE html><html><head><meta charset="UTF-8"><title>LOADING</title></head>
<body><canvas id="film" width="2206" height="946"></canvas>
<script>window.gsap={timeline:()=>({fromTo(){return this;}})};</script>
<script type="module">
try {
  const m = await import("./src/main.js");
  const B = await import("./src/shots/s18/shotB.js");
  const I = await import("./src/shots/s18/inkdraw.js");
  const film = document.getElementById("film");
  function gauss(src, w, h, s) {
    const r = Math.ceil(3 * s), k = new Float32Array(2 * r + 1); let sum = 0;
    for (let i = -r; i <= r; i++) { k[i + r] = Math.exp(-0.5 * i * i / (s * s)); sum += k[i + r]; } for (let i = 0; i < k.length; i++) k[i] /= sum;
    const t = new Float32Array(w * h), o = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let a = 0; for (let q = -r; q <= r; q++) { const xx = Math.min(w - 1, Math.max(0, x + q)); a += src[y * w + xx] * k[q + r]; } t[y * w + x] = a; }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let a = 0; for (let q = -r; q <= r; q++) { const yy = Math.min(h - 1, Math.max(0, y + q)); a += t[yy * w + x] * k[q + r]; } o[y * w + x] = a; }
    return o;
  }
  let S = {};
  const DIR0 = JSON.parse(JSON.stringify(B.FLYK.dir));
  window.prep = (f, box, b64) => {
    const [x0, y0, x1, y1] = box, w = x1 - x0, h = y1 - y0, bin = atob(b64), src = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) src[i] = bin.charCodeAt(i);
    S = { f, box, w, h, s6: gauss(src, w, h, 6), s2: gauss(src, w, h, 2) };
    return true;
  };
  window.trial = (set) => {
    const k = S.f === 1426 ? 1425 : S.f;
    B.FLYK.litOnly = !!set.litOnly; B.FLYK.rampDark = !!set.rampDark; B.FLYK.ramp = set.ramp || 3; B.FLYK.shelf = set.shelf || null; B.FLYK.dir = JSON.parse(JSON.stringify(DIR0)); if (set.dir) B.FLYK.dir[k] = set.dir;
    m.renderAt(S.f / 25);
    const [x0, y0] = S.box, c = I.cpuCanvas(S.w, S.h), g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(film, x0, y0, S.w, S.h, 0, 0, S.w, S.h);
    const d = g.getImageData(0, 0, S.w, S.h).data, r = new Float32Array(S.w * S.h); for (let i = 0; i < r.length; i++) r[i] = d[4 * i];
    const r6 = gauss(r, S.w, S.h, 6), r2 = gauss(r, S.w, S.h, 2);
    let e6 = 0, e2 = 0; for (let i = 0; i < r.length; i++) { e6 += Math.abs(r6[i] - S.s6[i]); e2 += Math.abs(r2[i] - S.s2[i]); }
    B.FLYK.litOnly = false; B.FLYK.rampDark = false; B.FLYK.ramp = 3; B.FLYK.shelf = null; B.FLYK.dir = JSON.parse(JSON.stringify(DIR0));
    return [e6 / r.length, e2 / r.length];
  };
  document.title = "READY";
} catch (e) { console.error(String(e && e.stack || e)); document.title = "FAIL"; }
</script></body></html>
