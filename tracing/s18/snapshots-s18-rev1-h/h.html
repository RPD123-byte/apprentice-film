<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>LOADING</title>
<style>html,body{margin:0;background:#000}</style></head>
<body><canvas id="film" width="2206" height="946"></canvas>
<script>window.gsap={timeline:()=>({fromTo(){return this;}})};</script>
<script type="module">
try {
  const m = await import("./src/main.js");
  const out = document.getElementById("film");
  window.renderT = (t) => { const t0 = performance.now(); m.renderAt(t); const url = out.toDataURL("image/png"); return { url, ms: performance.now() - t0 }; };
  document.title = "READY";
} catch (e) { console.error(String(e && e.stack || e)); document.title = "FAIL"; }
</script></body></html>
