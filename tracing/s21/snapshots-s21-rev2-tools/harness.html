<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; src: url("../../assets/fonts/Archivo-Var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Geist"; src: url("../../assets/fonts/Geist-Var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("../../assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
html,body{margin:0;background:#000}
</style></head><body>
<canvas id="film" width="2206" height="946"></canvas>
<script type="module">
import { createPost } from "../../src/lib/post.js";
const mod = await import(window.location.hash.slice(1) || "../../src/shots/s21.js");
const shot = mod.shot;
const W = 2206, H = 946;
const out = document.getElementById("film");
const paint = document.createElement("canvas"); paint.width = W; paint.height = H;
const ctx = paint.getContext("2d");
const grade = createPost(out);
await Promise.all(["900 100px Archivo", "400 20px Geist", "600 20px Geist", "500 20px 'Geist Mono'"].map((f) => document.fonts.load(f)));
await document.fonts.ready;
window.__mod = mod; window.__poses = await import("../../src/shots/s21/poses.js");
window.render = (t, graded = true, encode = true) => {
  const t0 = performance.now();
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over"; ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  shot.draw(ctx, t - 69.44, t, shot); ctx.restore();
  const dt = performance.now() - t0;
  if (graded) { grade(paint, t, { fade: 1 }); return encode ? { url: out.toDataURL("image/png"), dt } : { dt }; }
  return { url: paint.toDataURL("image/png"), dt };
};

window.ready = true;
</script></body></html>
