<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2206, height=946">
<title>s21 harness</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-Var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Variable.ttf") format("truetype"); font-weight: 100 900; }
@font-face { font-family: "Satoshi"; src: url("assets/fonts/Satoshi-Variable.woff2") format("woff2"); font-weight: 300 900; }
* { margin: 0; padding: 0; } html, body { width: 2206px; height: 946px; overflow: hidden; background: #000; }
#root { position: relative; width: 100%; height: 100%; } canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<div data-hf-id="hf-h21" id="root" data-composition-id="main" data-start="0" data-duration="5" data-fps="25" data-width="2206" data-height="946">
<canvas data-hf-id="hf-c21" id="c" width="2206" height="946"></canvas>
</div>
<script type="module">
import { shot } from "./src/shots/s21.js";
import { createPost } from "./src/lib/post.js";

const PAGES = [[{"t": 72.36, "box": [0, 0, 2206, 946], "at": [0, 0], "page": 0}], [{"t": 72.48, "box": [0, 0, 2206, 946], "at": [0, 0], "page": 1}], [{"t": 72.6, "box": [0, 0, 2206, 946], "at": [0, 0], "page": 2}], [{"t": 72.72, "box": [0, 0, 2206, 946], "at": [0, 0], "page": 3}]];
const W = 2206, H = 946;
const out = document.getElementById("c"), o = out.getContext("2d");
const paint = document.createElement("canvas"); paint.width = W; paint.height = H;
const p = paint.getContext("2d");
const glc = document.createElement("canvas"); glc.width = W; glc.height = H;
const grade = createPost(glc);
const S = { start: 69.44 };
await Promise.all(["900 100px Archivo", "400 20px Geist", "600 20px Geist", "500 20px 'Geist Mono'", "400 20px Fraunces", "700 20px Fraunces", "800 40px Satoshi"].map((f) => document.fonts.load(f)));
await document.fonts.ready;
let last = -1;
function page(k) {
  if (k === last || k < 0 || k >= PAGES.length) return; last = k;
  o.setTransform(1, 0, 0, 1, 0, 0); o.fillStyle = "#400"; o.fillRect(0, 0, W, H);
  for (const tl of PAGES[k]) {
    p.setTransform(1, 0, 0, 1, 0, 0); p.globalAlpha = 1; p.globalCompositeOperation = "source-over"; p.fillStyle = "#000"; p.fillRect(0, 0, W, H);
    p.save(); shot.draw(p, tl.t - S.start, tl.t, S); p.restore();
    grade(paint, tl.t, { fade: 1 });
    const [x0, y0, x1, y1] = tl.box;
    o.drawImage(glc, x0, y0, x1 - x0, y1 - y0, tl.at[0], tl.at[1], x1 - x0, y1 - y0);
  }
}
const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; page(Math.floor(v)); } };
const tl = gsap.timeline({ paused: true });
tl.fromTo(clock, { t: 0 }, { t: 5, duration: 5, ease: "none" }, 0);
window.addEventListener("hf-seek", (e) => page(Math.floor(e.detail.time)));
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
</script>
</body>
</html>
