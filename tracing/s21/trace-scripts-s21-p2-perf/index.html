<!DOCTYPE html>
<html lang="en">
<head>

<title>s21 perf scratch</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; } html, body { width: 2206px; height: 946px; overflow: hidden; background: #000; }
#root { position: relative; width: 100%; height: 100%; } canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<div data-hf-id="hf-2vjs" id="root" data-composition-id="main" data-start="0" data-duration="4" data-fps="25" data-width="2206" data-height="946">
<canvas data-hf-id="hf-jv0z" id="c" width="2206" height="946"></canvas>
</div>
<script type="module">
import { shot } from "./src/shots/s21.js";
const c = document.getElementById("c"), g = c.getContext("2d");
let done = false;
function run() {
  const ts = [69.6, 70.4, 71.2, 71.9, 72.2, 72.5, 72.8, 73.1, 73.6, 74.0, 74.4];
  // warm up (first-call caches)
  shot.draw(g, 0, 69.5);
  const out = [];
  for (const t of ts) { const t0 = performance.now(); for (let i = 0; i < 3; i++) { g.setTransform(1,0,0,1,0,0); g.fillStyle="#000"; g.fillRect(0,0,2206,946); shot.draw(g, t - 69.44, t + i * 0.04); } out.push([t, (performance.now() - t0) / 3]); }
  g.setTransform(1,0,0,1,0,0); g.fillStyle = "#000"; g.fillRect(0, 0, 900, 600); g.fillStyle = "#fff"; g.font = "30px monospace";
  out.forEach(([t, ms], i) => g.fillText(t.toFixed(2) + ": " + ms.toFixed(0) + " ms", 40, 60 + i * 44));
}
const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; if (!done && v > 0.5) { done = true; run(); } } };
const tl = gsap.timeline({ paused: true });
tl.fromTo(clock, { t: 0 }, { t: 4, duration: 4, ease: "none" }, 0);
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
</script>
</body>
