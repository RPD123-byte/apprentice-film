<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2206, height=946">
<title>s23 fit scratch</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
html,body{margin:0;width:2206px;height:946px;overflow:hidden;background:#000}
#root{position:relative;width:100%;height:100%}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="40" data-fps="25" data-width="2206" data-height="946">
<canvas id="c" width="2206" height="946"></canvas>
</div>
<script type="module">
import { SPEC } from "./spec.js";
const c = document.getElementById("c"), g = c.getContext("2d");
let last = -1;
function show(t) { const p = Math.floor(t); if (p === last) return; last = p; g.setTransform(1,0,0,1,0,0); g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height); const f = SPEC[p]; if (f) f(g); }
const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; show(v); } };
const tl = gsap.timeline({ paused: true });
tl.fromTo(clock, { t: 0 }, { t: 40, duration: 40, ease: "none" }, 0);
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
window.addEventListener("hf-seek", (e) => show(e.detail.time));
show(0);
</script>
</body>
</html>
