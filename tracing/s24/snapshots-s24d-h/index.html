<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2206, height=946">
<title>s24 harness</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-Var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Variable.ttf") format("truetype"); font-weight: 100 900; }
@font-face { font-family: "Shrikhand"; src: url("assets/fonts/Shrikhand.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Fraunces Soft"; src: url("assets/fonts/FrauncesSoft-Black.ttf") format("truetype"); font-weight: 900; }
@font-face { font-family: "Satoshi"; src: url("assets/fonts/Satoshi-Variable.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-500.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
html,body{margin:0;width:2206px;height:946px;overflow:hidden;background:#000}
#root{position:relative;width:100%;height:100%}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3.44" data-fps="25" data-width="2206" data-height="946">
<canvas id="c" width="2206" height="946"></canvas>
</div>
<script type="module">
// s24 scratch harness: harness time u -> film time 97.08 + u, one frame of s24 through the film's grade.
// ?raw in the URL hash skips the grade (not used by snapshot).
import { createPost } from "./src/lib/post.js";
const W = 2206, H = 946;
await Promise.all([
  "900 100px Archivo", "400 20px Geist", "600 20px Geist", "500 20px 'Geist Mono'", "400 20px Fraunces", "700 20px Fraunces",
  "900 100px 'Fraunces Soft'", "800 40px Satoshi", "400 40px Shrikhand", "500 20px Poppins", "600 20px Poppins", "700 20px Poppins",
].map((f) => document.fonts.load(f)));
await document.fonts.ready;
const { shot } = await import("./src/shots/s24.js");
const out = document.getElementById("c");
const paint = document.createElement("canvas"); paint.width = W; paint.height = H;
const ctx = paint.getContext("2d");
const grade = createPost(out);
function renderAt(u) {
  const t = 97.08 + Math.min(Math.max(u, 0), 3.399);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const t0 = performance.now();
  try { shot.draw(ctx, t - 97.08, t); } catch (e) { console.error(e); ctx.fillStyle = "#f00"; ctx.font = "30px monospace"; ctx.fillText(String(e && e.stack || e).slice(0, 200), 20, 60); }
  window.__lastMs = performance.now() - t0;
  ctx.restore();
  grade(paint, t, { fade: 1, ...(shot.grade ? shot.grade(t - 97.08, t) : {}) });
}
const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; renderAt(v); } };
const tl = gsap.timeline({ paused: true });
tl.fromTo(clock, { t: 0 }, { t: 3.44, duration: 3.44, ease: "none" }, 0);
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
window.__film = { renderAt };
renderAt(0);
</script>
</body>
</html>
