<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@font-face { font-family: "Archivo"; src: url("/assets/fonts/Archivo-Var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Geist"; src: url("/assets/fonts/Geist-Var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("/assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Fraunces"; src: url("/assets/fonts/Fraunces-Variable.ttf") format("truetype"); font-weight: 100 900; }
@font-face { font-family: "Shrikhand"; src: url("/assets/fonts/Shrikhand.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Fraunces Soft"; src: url("/assets/fonts/FrauncesSoft-Black.ttf") format("truetype"); font-weight: 900; }
@font-face { font-family: "Satoshi"; src: url("/assets/fonts/Satoshi-Variable.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Poppins"; src: url("/assets/fonts/Poppins-500.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Poppins"; src: url("/assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Poppins"; src: url("/assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
html,body{margin:0;background:#000}
</style></head><body>
<canvas id="film" width="2206" height="946"></canvas>
<script type="module">
// s26 scratch harness (not part of the film): renders only s26 through the film's grade, frame-exact.
import { createPost } from "/src/lib/post.js";
const SHOTMOD = new URLSearchParams(location.search).get("shot") || "/src/shots/s26.js";
const { shot } = await import(SHOTMOD);
const W = 2206, H = 946;
const out = document.getElementById("film");
const paint = document.createElement("canvas"); paint.width = W; paint.height = H;
const ctx = paint.getContext("2d");
const grade = createPost(out);
await Promise.all([
  "900 100px Archivo", "400 20px Geist", "600 20px Geist", "500 20px 'Geist Mono'", "400 20px Fraunces", "700 20px Fraunces",
  "900 100px 'Fraunces Soft'", "800 40px Satoshi", "400 40px Shrikhand", "500 20px Poppins", "600 20px Poppins", "700 20px Poppins",
].map((f) => document.fonts.load(f)));
await document.fonts.ready;
const START = Number(new URLSearchParams(location.search).get("start") || 110.52);
window.renderAt = (t, raw = false) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.save();
  const t0 = performance.now();
  shot.draw(ctx, t - START, t, shot);
  const ms = performance.now() - t0;
  ctx.restore();
  if (!raw) grade(paint, t, { fade: 1, ...(shot.grade ? shot.grade(t - START, t) : {}) });
  return ms;
};
window.grab = (raw = false) => (raw ? paint : out).toDataURL("image/png");
window.ready = true;
</script></body></html>
