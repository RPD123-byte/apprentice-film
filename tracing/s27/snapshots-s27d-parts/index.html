<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2206, height=946">
    <title>s27 harness</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-Var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Var.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Shrikhand"; src: url("assets/fonts/Shrikhand.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Fraunces Soft"; src: url("assets/fonts/FrauncesSoft-Black.ttf") format("truetype"); font-weight: 900; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-500.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 2206px; height: 946px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; }
      #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-s27d1" id="root" data-composition-id="main" data-start="0" data-duration="140.8" data-fps="25" data-width="2206" data-height="946">
      <canvas data-hf-id="hf-s27d2" id="film" width="2206" height="946"></canvas>
    </div>
    <script type="module">
      // s27 scratch harness (not part of the film): s27 alone through the film's grade. Times are FILM times.
      // t < 117.52 renders s27 at local 0. A query-less render; ?raw would skip the grade (not used by the snapshot tool).
      import { createPost } from "./src/lib/post.js";
      import { paintDesigner, DES_BOX } from "./src/shots/s27/drawn/designer.js";
      await document.fonts.ready;
      const out = document.getElementById("film");
      const paint = document.createElement("canvas"); paint.width = 2206; paint.height = 946;
      const ctx = paint.getContext("2d");
      const grade = createPost(out);
      const D = paintDesigner();
      // t=1: the designer texture alone on a mid-grey, placed at its 125.0 s frame position (ungraded)
      function renderAt(t) {
        ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = "#808080"; ctx.fillRect(0,0,2206,946);
        ctx.drawImage(D, DES_BOX.x, DES_BOX.y, DES_BOX.w, DES_BOX.h);
        ctx.strokeStyle = "#ff0"; ctx.lineWidth = 1; ctx.font = "14px monospace"; ctx.fillStyle = "#ff0";
        for (let x = 0; x < 1200; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 946); ctx.stroke(); ctx.fillText(String(x), x + 2, 14); }
        for (let y = 0; y < 946; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1200, y); ctx.stroke(); ctx.fillText(String(y), 2, y - 2); }
        // copy straight to the output canvas through the grade with zero effect: draw via 2D on a second canvas
        const o2 = out.getContext ? null : null;
        grade(paint, 50, { fade: 1, halo: 0, grain: 0 });
      }
      const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; renderAt(v); } };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: 140.8, duration: 140.8, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__film = { renderAt };
    </script>
  </body>
</html>
