<!doctype html><html><body><canvas id="o" width="2206" height="946"></canvas><script type="module">
import { createPost } from "../../src/lib/post.js";
const W = 2206, H = 946;
const paint = document.createElement("canvas"); paint.width = W; paint.height = H; const g = paint.getContext("2d");
const levels = [20, 50, 80, 110, 140, 170, 200, 230, 250];
levels.forEach((v, i) => { g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(0, i * H / 9, W, H / 9 + 1); });
const out = document.getElementById("o"); const grade = createPost(out);
const read = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d"); x.drawImage(out, 0, 0); return x.getImageData(0, 0, W, H).data; };
window.res = [];
for (const t of [138.0, 138.04]) {
  grade(paint, t, { grain: 0, halo: 0 }); const a = read();
  grade(paint, t, { grain: 7.5 / 255, halo: 0 }); const b = read();
  const row = [];
  levels.forEach((v, i) => { let s = 0, n = 0; const y0 = Math.round(i * H / 9) + 8, y1 = Math.round((i + 1) * H / 9) - 8; for (let y = y0; y < y1; y += 1) for (let x = 900; x < 1300; x++) { const k = (y * W + x) * 4; s += (b[k] + b[k + 1] + b[k + 2] - a[k] - a[k + 1] - a[k + 2]) / 3; n++; } row.push([v, +(s / n).toFixed(2)]); });
  window.res.push(row);
}
window.ready = true;
</script></body></html>
